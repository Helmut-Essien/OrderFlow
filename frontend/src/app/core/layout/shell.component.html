<div class="min-h-full bg-paper text-ink">
  <!-- Phone / tablet top bar. Sidebar takes over at lg so landscape phones keep this chrome. -->
  <header
    class="sticky top-0 z-30 flex min-h-14 items-center justify-between gap-3 border-b border-[#E5E0D5] bg-white px-4 pt-[env(safe-area-inset-top)] lg:hidden">
    <div class="min-w-0">
      <p class="text-[10px] font-semibold uppercase tracking-[0.2em] text-gold">OrderFlow</p>
      <p class="truncate text-sm font-bold text-forest">{{ shop.shopName() || 'Your shop' }}</p>
    </div>
    <button
      type="button"
      class="inline-flex min-h-[44px] shrink-0 items-center rounded-lg px-3 text-sm font-semibold text-stone-600 hover:bg-stone-100"
      (click)="auth.logout()">
      Sign out
    </button>
  </header>

  <!-- Desktop sidebar -->
  <aside class="fixed inset-y-0 left-0 z-40 hidden w-64 flex-col border-r border-[#E5E0D5] bg-white lg:flex">
    <div class="border-b border-[#E5E0D5] px-5 py-6">
      <p class="text-xs font-semibold uppercase tracking-[0.2em] text-gold">OrderFlow</p>
      <p class="mt-1 truncate text-lg font-bold text-forest">{{ shop.shopName() || 'Your shop' }}</p>
      <p class="mt-1 text-xs text-stone-500">{{ shop.plan()?.name || 'Plan' }}</p>
    </div>

    <nav class="flex flex-1 flex-col gap-1 p-3">
      <a
        routerLink="/app"
        routerLinkActive="bg-forest text-white"
        [routerLinkActiveOptions]="{ exact: true }"
        class="rounded-xl px-4 py-3 text-sm font-semibold text-stone-600 hover:bg-stone-100 hover:text-forest">
        Dashboard
      </a>
      <a
        routerLink="/app/products"
        routerLinkActive="bg-forest text-white"
        class="rounded-xl px-4 py-3 text-sm font-semibold text-stone-600 hover:bg-stone-100 hover:text-forest">
        Inventory
      </a>
    </nav>

    <div class="border-t border-[#E5E0D5] p-3">
      <button
        type="button"
        class="w-full min-h-[44px] rounded-xl px-4 py-3 text-left text-sm font-semibold text-stone-600 hover:bg-stone-100 hover:text-forest"
        (click)="auth.logout()">
        Sign out
      </button>
    </div>
  </aside>

  <div class="lg:ml-64">
    <main
      class="mx-auto max-w-[1280px] px-4 py-6 pb-[calc(6rem+env(safe-area-inset-bottom))] md:px-8 md:py-8 lg:pb-8">
      <router-outlet />
    </main>
  </div>

  <!-- Phone / tablet bottom nav -->
  <nav
    class="fixed inset-x-0 bottom-0 z-30 flex border-t border-[#E5E0D5] bg-white pb-[env(safe-area-inset-bottom)] lg:hidden">
    <a
      routerLink="/app"
      routerLinkActive="bg-forest text-white"
      [routerLinkActiveOptions]="{ exact: true }"
      class="flex min-h-[44px] flex-1 flex-col items-center justify-center gap-1 px-2 py-3 text-xs font-semibold text-stone-500">
      <span class="text-lg leading-none" aria-hidden="true">⌂</span>
      Dashboard
    </a>
    <a
      routerLink="/app/products"
      routerLinkActive="bg-forest text-white"
      class="flex min-h-[44px] flex-1 flex-col items-center justify-center gap-1 px-2 py-3 text-xs font-semibold text-stone-500">
      <span class="text-lg leading-none" aria-hidden="true">▦</span>
      Inventory
    </a>
  </nav>
</div>
